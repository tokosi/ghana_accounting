[project]
name = "ghana_accounting"
authors = [{ name = "Ghana Accounting Contributors", email = "support@example.com" }]
description = "Ghana tax compliance for ERPNext: VAT/NHIL/GETFund, withholding tax, claim and advance approval, journal voucher maker-checker"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
